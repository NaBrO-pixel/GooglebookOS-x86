[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "googlebook-x86"
version = "0.1.0rc1"
description = "Experimental Googlebook x86 offline installation tooling"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
